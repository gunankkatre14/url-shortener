# App
spring.application.name=urlshortener
#server.port=8080

server.port=${PORT:8080}

# changes for deployement 
# PostgreSQL ? docker-compose ke values se match karta hai
# spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
# spring.datasource.username=postgres
# spring.datasource.password=secret

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}


spring.datasource.driver-class-name=org.postgresql.Driver

# JPA ? tables auto create karega
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

spring.data.redis.host=${REDISHOST}
spring.data.redis.port=${REDISPORT}
spring.data.redis.password=${REDISPASSWORD:}

# Base URL
#app.base-url=http://localhost:8080

app.base-url=${APP_BASE_URL:http://localhost:8080}

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ?? Kafka ?????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest

# JWT
app.jwt.secret=mySecretKey12345678901234567890123456789012
app.jwt.expiration=86400000


# ?? Tomcat thread pool ?????????????????????????
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50

# ?? HikariCP DB connection pool ????????????????
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ?? Rate limit high for testing ????????????????
app.rate-limit.max-requests=10000